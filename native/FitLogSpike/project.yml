name: FitLogSpike
options:
  bundleIdPrefix: com.mlawrence
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 36LTV69776
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FitLogSpike:
    type: application
    platform: iOS
    sources: [FitLogSpike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlawrence.fitlog.spike
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Fit Log β"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
